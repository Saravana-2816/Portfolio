<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found | Saravanakumar KS</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #06070d;
        --text: #e9ebf4;
        --muted: #8d93ab;
        --signal: #7c9cff;
        --glow: #7fe3ff;
        --line: #2c3453;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f4f5f9;
          --text: #0a0c18;
          --muted: #50566e;
          --signal: #2f4bd8;
          --glow: #0a7fa8;
          --line: #bcc2d4;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(55% 45% at 80% 15%, color-mix(in srgb, var(--signal) 14%, transparent), transparent 70%),
          var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 34rem; }
      p.code {
        margin: 0;
        font-size: clamp(5rem, 22vw, 10rem);
        font-weight: 700;
        line-height: 0.9;
        letter-spacing: -0.06em;
        background: linear-gradient(100deg, var(--signal), var(--glow));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { margin: 1.5rem 0 0.75rem; font-size: 1.75rem; letter-spacing: -0.02em; }
      p { margin: 0; color: var(--muted); font-size: 1.1rem; line-height: 1.5; }
      a {
        display: inline-flex;
        margin-top: 2rem;
        padding: 0.8rem 1.4rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--text);
        text-decoration: none;
      }
      a:hover, a:focus-visible { border-color: var(--signal); outline: none; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>This page isn't in the index.</h1>
      <p>The link may be old or mistyped. Everything lives on the home page.</p>
      <a href="/">Go to the home page</a>
    </main>
  </body>
</html>
